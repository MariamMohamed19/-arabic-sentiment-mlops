services:
  api:
    build: .
    ports:
      - '8000:8000'
    environment:
      MODEL_PATH: /models/model
      MODEL_VERSION: v1
    volumes:
      - ./artifacts/model:/models/model:ro
    healthcheck:
      test: ['CMD','python','-c',"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
